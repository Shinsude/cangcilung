<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Gambar Puter</title>
<style>
  body { font-family: monospace; padding: 20px; background: #111; color: #eee; }
  #status { margin-bottom: 10px; }
  #result { margin-top: 20px; }
  img { max-width: 400px; border: 1px solid #444; margin-top: 10px; }
  .err { color: #f66; white-space: pre-wrap; }
  .ok { color: #6f6; }
</style>
</head>
<body>
  <h1>Debug txt2img Puter</h1>
  <button onclick="run()">Jalankan tes semua provider</button>
  <div id="status">Belum dijalankan</div>
  <div id="result"></div>

  <script src="https://js.puter.com/v2/"></script>
  <script>
    function log(msg) {
      var s = document.getElementById('status');
      s.innerHTML = s.innerHTML + '<br>' + msg;
    }
    var PROMPT = 'Mickey Mouse kartun klasik tersenyum';
    var TESTS = [
      { name: 'gemini', opts: { model: 'gemini-3.1-flash-image-preview' } },
      { name: 'xai/grok', opts: { provider: 'xai', model: 'grok-imagine-image' } },
      { name: 'openai-gpt-image-2', opts: { model: 'gpt-image-2' } },
      { name: 'openai-gpt-image-1-mini', opts: { model: 'gpt-image-1-mini' } },
      { name: 'together-flux', opts: { provider: 'together', model: 'black-forest-labs/flux-schnell' } }
    ];
    function run() {
      var r = document.getElementById('result');
      r.innerHTML = '';
      document.getElementById('status').innerHTML = 'Memulai tes...';
      log('puter.ai.txt2img tersedia: ' + !!(puter && puter.ai && puter.ai.txt2img));
      var chain = Promise.resolve();
      TESTS.forEach(function (t) {
        chain = chain.then(function () {
          log('--- Mencoba: ' + t.name + ' ---');
          return puter.ai.txt2img(PROMPT, t.opts)
            .then(function (image) {
              log('OK ' + t.name + ': tipe=' + (image ? image.constructor.name : 'null')
                + ' | isIMG=' + (image instanceof HTMLImageElement)
                + ' | src=' + (image && image.src ? image.src.slice(0, 40) + '...' : '(kosong)'));
              var wrap = document.createElement('div');
              wrap.innerHTML = '<h3 class="ok">Berhasil via: ' + t.name + '</h3>';
              if (image && image.nodeType) wrap.appendChild(image);
              r.appendChild(wrap);
            })
            .catch(function (err) {
              log('GAGAL ' + t.name + ': ' + (err && err.error ? err.error : err.message));
            });
        });
      });
      chain.then(function () { log('--- Selesai ---'); });
    }
  </script>
</body>
</html>
