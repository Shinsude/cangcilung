services:
  postgres:
    image: postgres:16
    container_name: ksynth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ksynth-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./services/api
    container_name: ksynth-api
    environment:
      APP_ENV: production
      FRONTEND_URL: http://localhost:3000
      AI_ENGINE_URL: http://ai-engine:8200
      MT5_BRIDGE_URL: http://mt5-bridge:8100
      USE_MOCK: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai-engine:
    build:
      context: ./services/ai-engine
    container_name: ksynth-ai-engine
    ports:
      - "8200:8200"

  mt5-bridge:
    build:
      context: ./services/mt5-bridge
    container_name: ksynth-mt5-bridge
    ports:
      - "8100:8100"

  web:
    build:
      context: ./apps/web
    container_name: ksynth-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
