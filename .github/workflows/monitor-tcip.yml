name: Pantau tcip.asia

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Jalankan pemantau
        run: node scripts/tcip-monitor.mjs

      - name: Commit data baru (jika ada perubahan)
        run: |
          git config user.name "cangcilung-bot"
          git config user.email "cangcilung-bot@users.noreply.github.com"
          git add tcip-data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data"
          else
            git commit -m "update data pantauan tcip.asia"
            git push origin main
          fi
