name: Deploy ke Vercel

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ketik yes untuk deploy via Actions (butuh VERCEL_TOKEN valid)'
        required: true
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lewati jika dari bot pemantau
        id: skip
        run: |
          AUTHOR="${{ github.event.head_commit.author.name }}"
          echo "author=$AUTHOR"
          if [ "$AUTHOR" = "cangcilung-bot" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.skip.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Deploy ke Vercel (production)
        if: steps.skip.outputs.skip == 'false'
        run: npx vercel@latest deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
